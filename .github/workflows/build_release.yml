name: Build Boon Table (cloud)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # 如果你想锁定到你指定的那个修复commit，解开下面这一行
          # ref: 5f8d978549d91aac4b5c9aa8210cbe08b6876ff0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -S . -B build --preset=release-windows

      - name: Build
        run: cmake --build build --preset=release-windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boontable-release
          path: build/d3d9_arcdps_table.dll
