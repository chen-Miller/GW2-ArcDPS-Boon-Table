name: Build Boon Table (cloud)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (release-windows)
        run: cmake --preset release-windows

      - name: Build
        run: cmake --build --preset release-windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d3d9_arcdps_table
          path: |
            cmake-build/**/d3d9_arcdps_table.dll
            cmake-build/**/d3d9_arcdps_table.pdb
          if-no-found: warn
